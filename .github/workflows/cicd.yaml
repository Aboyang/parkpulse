name: CI/CD Pipeline  # the name shown in GitHub Actions tab

on:  # what triggers this pipeline to run
  push:
    branches: [main]  # runs when you git push to main
  pull_request:
    branches: [main]  # runs when you open a PR targeting main

jobs:

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run lint check
        run: npm run lint
        working-directory: ./frontend

      - name: Run type check
        run: npm run typecheck
        working-directory: ./frontend

      - name: Build frontend  # catches import/bundle errors; dist not used here
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  test-backend:  # runs in parallel with test-frontend
    runs-on: ubuntu-latest  # another fresh Ubuntu machine, independent from the frontend one

    steps:
      - uses: actions/checkout@v3  # re-download repo code (each job is a separate machine)

      - uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install backend dependencies # install backend's own package.json dependencies
        run: npm ci  
        working-directory: ./server  # cd into backend folder
      
      - name: Run lint check # checks for code errors/bad practices
        run: npm run lint
        working-directory: ./server

      - name: Run backend tests
        run: npm test  # runs whatever is in your "test" script in backend/package.json
        working-directory: ./server  # run inside backend folder

  deploy:
    needs: [test-frontend, test-backend]  # only runs if both pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # skip on PRs, deploy only on merge to main

    permissions:
      contents: read
      packages: write              # required to push to GHCR

    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatically provided by GitHub, no setup needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # enables layer caching and multi-platform builds

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/smart-parking-server:latest
            ghcr.io/${{ env.OWNER }}/smart-parking-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/smart-parking-frontend:latest
            ghcr.io/${{ env.OWNER }}/smart-parking-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
